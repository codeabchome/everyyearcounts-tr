# Türkiye Kaçıncı? — günlük Shorts.
# Cron AÇIK: günde 3 video. Hedef saatler 08:07 / 13:13 / 18:19 TR.
# GitHub zamanlanmış işleri yoğunlukta saatlerce geciktirebiliyor (garanti yok);
# ":00" ve ":30" dakikaları herkesin kullandığı slotlar olduğu için kuyruğa
# giriyorduk — 3-5,5 saat gecikme ölçtük. Bu yüzden dakikalar tekil sayılara
# çekildi ve saatler öne alındı: gecikme olmazsa da olsa makul saate düşsün.
# Her çalıştırma kuyruktan SIRADAKİ konuyu alıp bir video yayınlar.
# Durdurmak için schedule bloğunu yorum satırına al veya Actions'tan
# iş akışını devre dışı bırak.
name: shorts-tr

on:
  workflow_dispatch:
    inputs:
      kuru:
        description: "Sadece render et, yükleme yapma (evet/hayir)"
        default: "hayir"
      konu:
        description: "Belirli konu id'si (boş bırakılabilir)"
        default: ""
      deneme:
        description: "Deneme videosu: gizli yükle, konuyu tüketme (evet/hayir)"
        default: "hayir"
  schedule:
    - cron: '7 5 * * *'      # 08:07 TR
    - cron: '13 10 * * *'    # 13:13 TR
    - cron: '19 15 * * *'    # 18:19 TR

permissions:
  contents: write

concurrency:
  group: tkc-yayin
  cancel-in-progress: false

jobs:
  yayinla:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      EYC_PRIVACY: public
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bagimliliklar
        run: pip install -r requirements_tr.txt

      - name: FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Video uret ve yukle
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.kuru }}" = "evet" ]; then ARGS="$ARGS --kuru"; fi
          if [ -n "${{ github.event.inputs.konu }}" ]; then ARGS="$ARGS --konu ${{ github.event.inputs.konu }}"; fi
          if [ "${{ github.event.inputs.deneme }}" = "evet" ]; then ARGS="$ARGS --deneme"; fi
          python main_tr.py $ARGS

      - name: Kuru calismada videoyu sakla
        if: ${{ github.event.inputs.kuru == 'evet' }}
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: cikti/*.mp4
          retention-days: 7

      - name: Durumu kaydet
        if: ${{ github.event.inputs.kuru != 'evet' }}
        run: |
          git config user.name "tkc-bot"
          git config user.email "tkc-bot@users.noreply.github.com"
          git add state_tr.json
          git diff --cached --quiet || git commit -m "state: $(date +%F)"
          git push
