# Türkiye Kaçıncı? — günlük Shorts.
# Cron şimdilik KAPALI: önce elle çalıştırıp videoyu kontrol ediyoruz,
# her şey yolundaysa aşağıdaki schedule blogundaki # işaretleri kaldırılacak.
name: shorts-tr

on:
  workflow_dispatch:
    inputs:
      kuru:
        description: "Sadece render et, yükleme yapma (evet/hayir)"
        default: "hayir"
      konu:
        description: "Belirli konu id'si (boş bırakılabilir)"
        default: ""
      deneme:
        description: "Deneme videosu: gizli yükle, konuyu tüketme (evet/hayir)"
        default: "hayir"
# schedule:
#   - cron: '30 6 * * *'     # 09:30 TR
#   - cron: '30 11 * * *'    # 14:30 TR
#   - cron: '30 16 * * *'    # 19:30 TR

permissions:
  contents: write

concurrency:
  group: tkc-yayin
  cancel-in-progress: false

jobs:
  yayinla:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      EYC_PRIVACY: public
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bagimliliklar
        run: pip install -r requirements_tr.txt

      - name: FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Video uret ve yukle
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.kuru }}" = "evet" ]; then ARGS="$ARGS --kuru"; fi
          if [ -n "${{ github.event.inputs.konu }}" ]; then ARGS="$ARGS --konu ${{ github.event.inputs.konu }}"; fi
          if [ "${{ github.event.inputs.deneme }}" = "evet" ]; then ARGS="$ARGS --deneme"; fi
          python main_tr.py $ARGS

      - name: Kuru calismada videoyu sakla
        if: ${{ github.event.inputs.kuru == 'evet' }}
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: cikti/*.mp4
          retention-days: 7

      - name: Durumu kaydet
        if: ${{ github.event.inputs.kuru != 'evet' }}
        run: |
          git config user.name "tkc-bot"
          git config user.email "tkc-bot@users.noreply.github.com"
          git add state_tr.json
          git diff --cached --quiet || git commit -m "state: $(date +%F)"
          git push
